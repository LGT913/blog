services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports: ["8848:8848", "9848:9848"]
    networks:
      - blog-network
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blog_cloud
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    networks:
      - blog-network
  user-service:
    build: ./blog-user-service
    environment:
      DB_HOST: mysql
      DB_PASSWORD: root
      NACOS_ADDR: nacos:8848
      REDIS_HOST: redis
      REDIS_PASSWORD: 123456
    depends_on: [nacos, mysql,redis]
    networks:
      - blog-network
  article-service:
    build: ./blog-article-service
    environment:
      DB_HOST: mysql
      DB_PASSWORD: root
      NACOS_ADDR: nacos:8848
      REDIS_HOST: redis
      REDIS_PASSWORD: 123456
    depends_on: [nacos, mysql,redis]
    networks:
      - blog-network
  gateway:
    build: ./blog-gateway
#    ports: ["8080:8080"]
    environment:
      NACOS_ADDR: nacos:8848
    depends_on: [nacos, user-service, article-service]
    networks:
      - blog-network
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=123456
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always
    networks:
      - blog-network
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
    networks:
      - blog-network
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - gateway
    restart: always
    networks:
      - blog-network
  sentinel-dashboard:
    build: ./docker/sentinel
    ports:
      - "8858:8080"
    container_name: sentinel-dashboard
    restart: always
    networks:
      - blog-network

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

# 全局定义网络 blog-network（和sentinel配置名称完全对应）
networks:
  blog-network:
    driver: bridge