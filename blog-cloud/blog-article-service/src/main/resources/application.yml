server:
  port: 8082

spring:
  application:
    name: blog-article-service
  config:
    import:
      - optional:nacos:blog-article-service.yml?group=DEFAULT_GROUP&refreshEnabled=true
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/blog_cloud?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 2
  cloud:
    nacos:
      config:
        server-addr: nacos:8848
      discovery:
        server-addr: nacos:8848
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
    sentinel:
      transport:
        dashboard: sentinel-dashboard:8080   # 容器互通：服务名sentinel-dashboard + 容器内端口8080，不要写localhost/8858
        port: 8719                  # 客户端上报端口，被占用会自动 +1，可省略
      eager: true                   # 启动即注册到 Dashboard，方便验证

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}