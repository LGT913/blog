spring:
  application:
    name: blog-gateway
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        file-extension: yaml
        group: DEFAULT_GROUP
        refresh-enabled: true
        shared-configs:
          - dataId: blog-common.yaml
            group: DEFAULT_GROUP
            refresh: true
